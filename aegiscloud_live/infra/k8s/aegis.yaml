# Reference manifests: the same objects infra/backends/k8s_backend.py creates for you (you do not have to apply this file).
# kubectl apply -f infra/k8s/aegis.yaml     # to inspect / run it by hand
apiVersion: v1
kind: Namespace
metadata: {name: aegis}
---
apiVersion: v1
kind: ResourceQuota                    # the whole namespace may not use more than the device allows
metadata: {name: aegis-quota, namespace: aegis}
spec:
  hard: {requests.cpu: "5", limits.cpu: "5", requests.memory: 1920Mi, limits.memory: 1920Mi, pods: "12"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aegis-replica, namespace: aegis}
spec:
  replicas: 0                          # the agent sets this through the gateway
  selector: {matchLabels: {app: aegis-replica}}
  template:
    metadata: {labels: {app: aegis-replica, aegiscloud: replica}}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: aegiscloud-replica:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8001}]
          env:
            - {name: AEGIS_CPU_BURN_MS, value: "20"}
            - {name: AEGIS_TARGET_MEM_MB, value: "103"}
          resources:                   # requests = limits: this is the CPU / RAM share of one replica
            requests: {cpu: 500m, memory: 192Mi}
            limits: {cpu: 500m, memory: 192Mi}
          readinessProbe:              # traffic only reaches the Pod after this succeeds (that delay is the real startup time)
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 1
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata: {name: aegis-replica, namespace: aegis}
spec:
  type: NodePort
  selector: {app: aegis-replica}
  ports: [{port: 80, targetPort: 8001, nodePort: 30080}]
